name: Deploy to Vercel

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel project settings
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Set GEMINI_API_KEY on Vercel
        # Keeps Vercel's env var in sync with your GitHub secret named MY_API_KEY.
        # Uses printf (not echo) so no trailing newline gets stored with the key —
        # a trailing newline makes the key invalid when Google reads the header.
        run: |
          vercel env rm GEMINI_API_KEY production --yes --token=${{ secrets.VERCEL_TOKEN }} || true
          printf '%s' "${{ secrets.MY_API_KEY }}" | vercel env add GEMINI_API_KEY production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build project artifacts
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to Vercel
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
